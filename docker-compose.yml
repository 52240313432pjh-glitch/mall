services:
  mysql:
    image: mysql:8.0
    container_name: mall-mysql
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mall
    ports:
      - "3306:3306"
    volumes:
      - mall-mysql-data:/var/lib/mysql
      - ./document/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7
    container_name: mall-redis
    command: redis-server --appendonly yes
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mall-redis-data:/data

  mongo:
    image: mongo:4
    container_name: mall-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mall-mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:3.9.11-management
    container_name: mall-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - mall-rabbitmq-data:/var/lib/rabbitmq

  mall-portal:
    image: eclipse-temurin:17-jre
    container_name: mall-portal
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_started
    ports:
      - "8085:8085"
    volumes:
      - ./mall-portal/target/mall-portal-1.0-SNAPSHOT.jar:/app.jar:ro
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_MONGODB_HOST: mongo
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_VIRTUAL_HOST: "mall"
      SPRING_RABBITMQ_USERNAME: mall
      SPRING_RABBITMQ_PASSWORD: mall
      FASHIONIQ_SERVICE_URL: "http://host.docker.internal:8765"
      FASHIONIQ_SERVICE_TOKEN: "${FASHIONIQ_SERVICE_TOKEN:-}"
    command: ["java", "-jar", "/app.jar"]

  mall-web:
    image: nginx:1.25-alpine
    container_name: mall-web
    restart: unless-stopped
    depends_on:
      - mall-portal
    ports:
      - "8080:80"
    volumes:
      - ./mall-app-web/dist/build/h5:/usr/share/nginx/html:ro
      - ./mall-app-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  mall-admin:
    image: eclipse-temurin:17-jre
    container_name: mall-admin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8090:8080"
    volumes:
      - ./mall-admin/target/mall-admin-1.0-SNAPSHOT.jar:/app.jar:ro
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_DATABASE: 0
      SPRING_DATA_REDIS_TIMEOUT: 3s
    command: ["java", "-jar", "/app.jar"]

  mall-admin-web:
    image: nginx:1.25-alpine
    container_name: mall-admin-web
    restart: unless-stopped
    depends_on:
      - mall-admin
    ports:
      - "8091:80"
    volumes:
      - ./mall-admin-web/dist:/usr/share/nginx/html:ro
      - ./mall-admin-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  mall-images:
    image: nginx:1.25-alpine
    container_name: mall-images
    restart: unless-stopped
    ports:
      - "8092:80"
    volumes:
      - D:/dataset/fashioniq:/usr/share/nginx/html/images:ro
      - ./images-nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mall-mysql-data:
  mall-redis-data:
  mall-mongo-data:
  mall-rabbitmq-data: